# Fetch league defense data once a day and commit data/league-defense.json.
# The app serves from this file on Render (fast, no NBA API calls at request time).
name: Update league data

on:
  schedule:
    # Run daily at 12:00 UTC (e.g. 7am ET)
    - cron: "0 12 * * *"
  workflow_dispatch:
    # Allow manual run: Actions → Update league data → Run workflow

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch league data
        env:
          FORCE_LEAGUE_FETCH: "1"
          NBA_LONG_TIMEOUT: "1"
          # Optional: set repo secret NBA_PROXY_URL (e.g. http://user:pass@proxy:8080) so requests use a proxy and avoid NBA API blocking cloud IPs
          HTTP_PROXY: ${{ secrets.NBA_PROXY_URL }}
          HTTPS_PROXY: ${{ secrets.NBA_PROXY_URL }}
        run: python scripts/fetch_league_data.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/league-defense.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update league-defense cache [skip ci]"
            git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:main
          fi
